name:  👾Fábrica Alquímica:Purificador Windows (MinGW) (.c ➔ .o)

on:
  workflow_dispatch:
    inputs:
      repositorio:
        description: 'Cole o link do repositório alvo (ex: https://github.com/sqlite/sqlite)'
        required: true
        default: ''

jobs:
  fabrica-purificacao-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🔧 Instalando o Compilador Cruzado MinGW-w64 e Binutils"
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential binutils mingw-w64

      - name: "🚀 Caçando, Transmutando para Windows e Organizando a Tribo Binária"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          # 🔗 Captura limpa do repositório digitado
          REPO_ALVO="${{ github.event.inputs.repositorio }}"
          TEMP_CLONE="temp_repo_clone"
          
          # Limpa espaços extras ou quebras indesejadas na URL
          REPO_ALVO=$(echo "$REPO_ALVO" | xargs)
          NOME_REPO=$(basename "$REPO_ALVO" .git)
          
          # Trava de segurança contra arquivos fantasmas ou nomes inválidos
          if [ -z "$NOME_REPO" ] || [ "$NOME_REPO" = "para" ]; then
              echo "[!] Erro crítico: Nome de repositório inválido detectado!"
              exit 1
          fi
          
          # Separando a pasta de destino para a versão do Windows
          PASTA_DESTINO="minhas-bibliotecas-100-c-windows/$NOME_REPO"
          
          echo "=== 🧪 INICIANDO PURIFICAÇÃO WINDOWS (MINGW) ==="
          echo "[*] Repositório alvo oficial: $REPO_ALVO"
          
          mkdir -p "$PASTA_DESTINO"
          rm -rf "$TEMP_CLONE"
          
          # 📜 Registro de origem da tribo Windows
          echo "Origem da Forja Windows (MinGW): $REPO_ALVO" > "$PASTA_DESTINO/origem.txt"
          echo "Data da Operação: $(date -u)" >> "$PASTA_DESTINO/origem.txt"
          
          # 📄 Criando um README.md interno para o link no GitHub
          echo "# Arsenal do Clã Windows (MinGW): $NOME_REPO" > "$PASTA_DESTINO/README.md"
          echo "" >> "$PASTA_DESTINO/README.md"
          echo "**Repositório de Origem:** [$REPO_ALVO]($REPO_ALVO)" >> "$PASTA_DESTINO/README.md"
          echo "**Arquitetura Alvo:** Windows (x86_64-w64-mingw32)" >> "$PASTA_DESTINO/README.md"
          echo "**Data de Fornagem:** $(date -u)" >> "$PASTA_DESTINO/README.md"
          
          echo "[*] Clonando repositório de $REPO_ALVO..."
          git clone --depth 1 "$REPO_ALVO" "$TEMP_CLONE" --quiet
          
          echo "[*] Compilando arquivos C puros para Windows com x86_64-w64-mingw32-gcc..."
          find "$TEMP_CLONE" -type f -name "*.c" | while read -r source_file; do
              nome_arquivo=$(basename "$source_file")
              name=$(echo "$nome_arquivo" | sed 's/\.[^.]*$//')
              
              objeto_saida="$PASTA_DESTINO/${name}.o"
              
              # Usando o GCC cruzado do MinGW para gerar objetos voltados para Windows
              if x86_64-w64-mingw32-gcc -c "$source_file" -o "$objeto_saida" -w; then
                  echo "[+] Sucesso: ${name}.o forjado para Windows na tribo $NOME_REPO!"
              else
                  echo "[!] Aviso: Falha ao compilar $nome_arquivo para Windows (ignorando)."
              fi
          done
          
          # 🗄️ A Mágica do Clã Windows: Empacotando com o ar do mingw
          echo "[*] Forjando o Arquivo de Clã estático (.a) para Windows..."
          cd "$PASTA_DESTINO"
          if ls *.o 1> /dev/null 2>&1; then
              x86_64-w64-mingw32-ar rcs "lib${NOME_REPO}_win.a" *.o
              echo "[+] Biblioteca estática Windows lib${NOME_REPO}_win.a criada com sucesso!"
          else
              echo "[!] Nenhum objeto .o encontrado para empacotar."
          fi
          cd - > /dev/null
          
          echo "[*] Limpando vestígios temporários..."
          rm -rf "$TEMP_CLONE"
          
          echo "[+] Processo de Purificação Windows Concluído para: $REPO_ALVO!"
          ls -la "$PASTA_DESTINO"

      - name: "📦 Sincronizar Arsenal Windows no Repositório"
        run: |
          git config --global user.name "Carlos Bot"
          git config --global user.email "carlos@bot.local"
          git add minhas-bibliotecas-100-c-windows/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "🧪 [CLÃ-WINDOWS] Arsenal MinGW forjado do repositório: ${{ github.event.inputs.repositorio }} [skip ci]"
            git push
          fi
