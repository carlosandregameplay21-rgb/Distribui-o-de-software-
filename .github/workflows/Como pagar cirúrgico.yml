name: 🎯 Extração Cirúrgica Automática (.h)

on:
  workflow_dispatch:
    inputs:
      link_raw:
        description: 'Cole aqui o link direto (raw) do arquivo .h'
        required: true
        default: ''

jobs:
  cirurgia-header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "🎯 Executando Manobra Cirúrgica do .h"
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          LINK_ALVO="${{ github.event.inputs.link_raw }}"
          PASTA_ALVO=".h"

          # Extrai automaticamente o nome original do arquivo do final do link (ex: SDL_video.h)
          NOME_DESTINACAO=$(basename "$LINK_ALVO")

          echo "=== 🎯 INICIANDO BUSCA CIRÚRGICA AUTOMÁTICA ==="
          echo "[*] Alvo inserido: $LINK_ALVO"
          echo "[*] Nome original detectado: $NOME_DESTINACAO"
          echo "[*] Criando ou acessando a pasta de repositórios: $PASTA_ALVO"
          mkdir -p "$PASTA_ALVO"

          echo "[*] Puxando o arquivo alvo de forma cirúrgica..."
          wget -q "$LINK_ALVO" -O "$PASTA_ALVO/$NOME_DESTINACAO"

          echo "[+] Sucesso! Arquivo salvo em: $PASTA_ALVO/$NOME_DESTINACAO"
          ls -la "$PASTA_ALVO"

      - name: "📦 Sincronizar Header no Repositório"
        run: |
          git config --global user.name "Carlos Bot"
          git config --global user.email "carlos@bot.local"
          git add .h/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "🎯 [CIRURGIA .H] Header extraído automaticamente e versionado [skip ci]"
            git push
          fi
          
